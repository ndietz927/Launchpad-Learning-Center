<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loading...</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: #0d0d0d;
    color: #fff;
}

h1, h2, h3 {
    text-align: center;
    color: #ff8a65;
}

.form-box, .content-box {
    background: #1c1c1c;
    padding: 20px;
    border-radius: 14px;
    max-width: 900px;
    margin: 20px auto;
    box-shadow: 0 0 25px rgba(255, 94, 77, 0.3);
}

input, textarea, select, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid #444;
    background-color: #2c2c2c;
    color: #fff;
}

button {
    background: linear-gradient(135deg, #ff512f, #dd2476);
    border: none;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: linear-gradient(135deg, #dd2476, #ff512f);
}

.item {
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    background: #2c2c2c;
}

.assignment { border-left: 6px solid #ff512f; }
.post { border-left: 6px solid #6c757d; }

.actions button {
    width: auto;
    margin-right: 5px;
}

.edit-btn { background: #ffc107; color: #000; }
.delete-btn { background: #dc3545; }
.view-submissions-btn { background: #0dcaf0; color: #000; }
.save-grade-btn { background: #198754; }

</style>
</head>

<body>

<h1 id="classHeader">Loading...</h1>

<div class="form-box">
    <h2>Create Assignment / Post</h2>

    <select id="contentType">
        <option value="assignment">Assignment</option>
        <option value="post">Post</option>
    </select>

    <input type="text" id="title" placeholder="Title" />
    <textarea id="description" placeholder="Description"></textarea>
    <input type="date" id="dueDate" />

    <button id="saveBtn">Upload</button>
</div>

<div class="content-box">
    <h2>Class Content</h2>
    <div id="contentList"></div>
</div>

<div class="content-box">
    <h2>Student Submissions</h2>
    <div id="submissionPanel">
        <p style="color:#aaa;">Select an assignment to view submissions.</p>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {
    getFirestore, collection, doc, addDoc, onSnapshot,
    updateDoc, deleteDoc, getDoc
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyCCotUqgZkDULpRLeyb9lvCma_SYO0CFb0",
    authDomain: "simpleloginapp-a7b53.firebaseapp.com",
    projectId: "simpleloginapp-a7b53",
    storageBucket: "simpleloginapp-a7b53.firebasestorage.app",
    messagingSenderId: "410260892945",
    appId: "1:410260892945:web:5339e6de4dbf5cec2cf0b0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const classCode = new URLSearchParams(window.location.search).get("code");

const classHeader = document.getElementById("classHeader");
const contentList = document.getElementById("contentList");
const submissionPanel = document.getElementById("submissionPanel");

const saveBtn = document.getElementById("saveBtn");
const titleInput = document.getElementById("title");
const descriptionInput = document.getElementById("description");
const dueDateInput = document.getElementById("dueDate");
const typeSelect = document.getElementById("contentType");

let editId = null;

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "index.html";
        return;
    }
    await loadClassName();
    loadContent();
});

async function loadClassName() {
    const snap = await getDoc(doc(db, "classes", classCode));
    if (!snap.exists()) {
        classHeader.textContent = "Class Not Found";
        return;
    }
    const name = snap.data().name;
    classHeader.textContent = name;
    document.title = name;
}

function loadContent() {
    onSnapshot(collection(db, "classContent"), (snapshot) => {
        let items = [];

        snapshot.forEach(docSnap => {
            const data = docSnap.data();
            if (data.classCode === classCode) {
                items.push({ id: docSnap.id, ...data });
            }
        });

        renderItems(items);
    });
}

function renderItems(items) {
    contentList.innerHTML = "";

    items.forEach(item => {
        const div = document.createElement("div");
        div.className = "item " + item.type;

        div.innerHTML = `
            <h3>${item.title}</h3>
            <p>${item.description}</p>
            ${item.type === "assignment" ? `<small>Due: ${item.dueDate}</small>` : ""}
            <div class="actions">
                <button class="edit-btn">Edit</button>
                <button class="delete-btn">Delete</button>
                ${item.type === "assignment" 
                    ? `<button class="view-submissions-btn">View Submissions</button>` 
                    : ""}
            </div>
        `;

        div.querySelector(".edit-btn").onclick = () => {
            titleInput.value = item.title;
            descriptionInput.value = item.description;
            dueDateInput.value = item.dueDate || "";
            typeSelect.value = item.type;
            editId = item.id;
        };

        div.querySelector(".delete-btn").onclick = async () => {
            if (confirm("Delete this item?")) {
                await deleteDoc(doc(db, "classContent", item.id));
            }
        };

        const viewBtn = div.querySelector(".view-submissions-btn");
        if (viewBtn) {
            viewBtn.onclick = () => loadSubmissions(item.id, item.title);
        }

        contentList.appendChild(div);
    });
}

function loadSubmissions(assignmentId, title) {
    submissionPanel.innerHTML = `<h3>Submissions for: ${title}</h3>`;

    const submissionsRef = collection(
        db,
        "classContent",
        assignmentId,
        "submissions"
    );

    onSnapshot(submissionsRef, (snapshot) => {
        submissionPanel.innerHTML = `<h3>Submissions for: ${title}</h3>`;

        if (snapshot.empty) {
            submissionPanel.innerHTML += `<p style="color:#aaa;">No submissions yet.</p>`;
            return;
        }

        snapshot.forEach(docSnap => {
            const data = docSnap.data();
            const studentId = docSnap.id;

            const div = document.createElement("div");
            div.className = "item";
            div.innerHTML = `
                <p><strong>Student:</strong> ${data.studentEmail}</p>
                <p><strong>Submission:</strong> ${data.submission}</p>

                <label>Grade</label>
                <input type="text" id="grade-${studentId}" value="${data.grade || ""}" />

                <label>Feedback</label>
                <textarea id="feedback-${studentId}">${data.feedback || ""}</textarea>

                <button class="save-grade-btn">Save Grade</button>
                <hr/>
            `;

            div.querySelector(".save-grade-btn").onclick = async () => {
                const grade = document.getElementById(`grade-${studentId}`).value;
                const feedback = document.getElementById(`feedback-${studentId}`).value;

                await updateDoc(
                    doc(db, "classContent", assignmentId, "submissions", studentId),
                    {
                        grade,
                        feedback,
                        gradedAt: new Date().toISOString()
                    }
                );

                alert("✅ Grade saved!");
            };

            submissionPanel.appendChild(div);
        });
    });
}

saveBtn.onclick = async () => {
    const data = {
        classCode,
        title: titleInput.value.trim(),
        description: descriptionInput.value.trim(),
        dueDate: typeSelect.value === "assignment" ? dueDateInput.value : "",
        type: typeSelect.value,
        createdAt: Date.now()
    };

    if (!data.title || !data.description) {
        alert("Please fill all fields");
        return;
    }

    if (editId) {
        await updateDoc(doc(db, "classContent", editId), data);
        editId = null;
    } else {
        await addDoc(collection(db, "classContent"), data);
    }

    titleInput.value = "";
    descriptionInput.value = "";
    dueDateInput.value = "";
};
</script>

</body>
</html>
