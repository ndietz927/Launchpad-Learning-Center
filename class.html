<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loading...</title>

<style>
/* ===== Body ===== */
body { font-family: Arial,sans-serif; margin:0; padding:20px; background:#0d0d0d; color:#fff; }
h1,h2 { text-align:center; color:#ff8a65; }
.form-box,.content-box { background:#1c1c1c; padding:20px; border-radius:14px; max-width:800px; margin:20px auto; box-shadow:0 0 25px rgba(255,94,77,0.3); }
input,textarea,select,button { width:100%; padding:10px; margin-top:10px; border-radius:8px; border:1px solid #444; background:#2c2c2c; color:#fff; }
input::placeholder,textarea::placeholder { color:#aaa; }
button { background:linear-gradient(135deg,#ff512f,#dd2476); border:none; color:white; cursor:pointer; font-weight:bold; }
button:hover { background:linear-gradient(135deg,#dd2476,#ff512f); }
.item { padding:15px; border-radius:10px; margin-bottom:15px; position:relative; background:#2c2c2c; color:#fff; }
.assignment { border-left:6px solid #ff512f; }
.assignment.upcoming { background:#3a3a3a; }
.assignment.overdue { background:#5c1a1a; border-left-color:#dc3545; }
.post { border-left:6px solid #6c757d; }
.item h3 { margin:0; color:#ff8a65; }
.item small { color:#ccc; }
.actions { margin-top:10px; }
.actions button { width:auto; padding:5px 10px; margin-right:5px; border-radius:6px; }
.edit-btn { background-color:#ffc107; color:#000; }
.delete-btn { background-color:#dc3545; color:white; }
input:focus,textarea:focus,select:focus { border-color:#ff512f; outline:none; }
::-webkit-scrollbar { width:8px; }
::-webkit-scrollbar-track { background:#1c1c1c; }
::-webkit-scrollbar-thumb { background:#ff512f; border-radius:4px; }
</style>
</head>

<body>

<h1 id="classHeader">Loading...</h1>

<div class="form-box">
    <h2>Create Assignment / Post</h2>
    <select id="contentType">
        <option value="assignment">Assignment</option>
        <option value="post">Post</option>
    </select>
    <input type="text" id="title" placeholder="Title" />
    <textarea id="description" placeholder="Description"></textarea>
    <input type="date" id="dueDate" />
    <button id="saveBtn">Upload</button>
</div>

<div class="content-box">
    <h2>Class Content</h2>
    <div id="contentList"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, collection, doc, addDoc, onSnapshot, updateDoc, deleteDoc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyCCotUqgZkDULpRLeyb9lvCma_SYO0CFb0",
    authDomain: "simpleloginapp-a7b53.firebaseapp.com",
    projectId: "simpleloginapp-a7b53",
    storageBucket: "simpleloginapp-a7b53.firebasestorage.app",
    messagingSenderId: "410260892945",
    appId: "1:410260892945:web:5339e6de4dbf5cec2cf0b0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// Class code from URL
const classCode = new URLSearchParams(window.location.search).get("code");

// Elements
const classHeader = document.getElementById("classHeader");
const contentList = document.getElementById("contentList");
const saveBtn = document.getElementById("saveBtn");
const titleInput = document.getElementById("title");
const descriptionInput = document.getElementById("description");
const dueDateInput = document.getElementById("dueDate");
const typeSelect = document.getElementById("contentType");
let editId = null;

onAuthStateChanged(auth, async (user) => {
    if (!user) return window.location.href="index.html";

    // Load class info
    const classSnap = await getDoc(doc(db, "classes", classCode));
    if (!classSnap.exists()) { classHeader.textContent = "Class Not Found"; return; }
    const classData = classSnap.data();
    classHeader.textContent = classData.name;

    // Show assignments/posts
    loadContent();
});

function loadContent() {
    const assignmentsRef = collection(db, "classes", classCode, "assignments");
    const postsRef = collection(db, "classes", classCode, "posts");

    // Assignments
    const qAssign = query(assignmentsRef, orderBy("createdAt","desc"));
    onSnapshot(qAssign, snapshot => renderItems(snapshot.docs.map(d=>({id:d.id,...d.data()})),"assignment"));

    // Posts
    onSnapshot(postsRef, snapshot => renderItems(snapshot.docs.map(d=>({id:d.id,...d.data()})),"post"));
}

function renderItems(items,type) {
    // Merge items into contentList sorted by date
    const today = new Date().toISOString().split("T")[0];

    items.forEach(item=>{
        const div = document.createElement("div");
        let classes = "item " + type;
        if(type==="assignment") classes += item.dueDate<today?" overdue":" upcoming";
        div.className = classes;
        div.innerHTML = `
            <h3>${item.title}</h3>
            <p>${item.description}</p>
            ${type==="assignment"?`<small>Due: ${item.dueDate}</small>`:""}
            <div class="actions">
                <button class="edit-btn">Edit</button>
                <button class="delete-btn">Delete</button>
            </div>
        `;

        div.querySelector(".edit-btn").onclick=()=>{
            titleInput.value=item.title;
            descriptionInput.value=item.description;
            dueDateInput.value=item.dueDate||"";
            typeSelect.value=type;
            editId=item.id;
        };
        div.querySelector(".delete-btn").onclick=async ()=>{
            if(confirm("Delete this item?")){
                await deleteDoc(doc(db,"classes",classCode,type==="assignment"?"assignments":"posts",item.id));
            }
        };
        contentList.appendChild(div);
    });
}

// Save/Edit
saveBtn.onclick=async ()=>{
    const type = typeSelect.value;
    const data = {
        title:titleInput.value.trim(),
        description:descriptionInput.value.trim(),
        dueDate:type==="assignment"?dueDateInput.value:"",
        createdAt: Date.now()
    };
    if(!data.title||!data.description){ alert("Fill all fields"); return; }

    if(editId){
        await updateDoc(doc(db,"classes",classCode,type==="assignment"?"assignments":"posts",editId),data);
        editId=null;
    } else {
        await addDoc(collection(db,"classes",classCode,type==="assignment"?"assignments":"posts"),data);
    }

    titleInput.value=""; descriptionInput.value=""; dueDateInput.value="";
};
</script>

</body>
</html>
