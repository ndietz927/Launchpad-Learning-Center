<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Dashboard</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background-color: #0d0d0d;
      color: #fff;
      min-height: 100vh;
      padding-top: 130px;
    }
    .navbar {
      background-color: #1a1a1a !important;
      box-shadow: 0 2px 10px rgba(255, 94, 77, 0.3);
    }
    .card {
      background: #1c1c1c;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(221, 36, 118, 0.3);
      color: #fff;
    }
    label {
      color: #ffb199;
      font-weight: 500;
    }
    input, textarea, select {
      background-color: #2b2b2b !important;
      color: #fff !important;
      border: 1px solid #444 !important;
    }
    input::placeholder, textarea::placeholder {
      color: #aaa;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff512f, #dd2476);
      border: none;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #dd2476, #ff512f);
    }
    .section-divider {
      border-top: 1px solid #ff8a65;
      margin: 40px 0;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Class Dashboard</a>
    </div>
  </nav>

  <div class="container mt-4">
    <!-- Assignment Creation -->
    <div class="card p-4 mb-4">
      <h4 style="color:#ff8a65;">Create New Assignment</h4>
      <form id="assignmentForm">
        <div class="mb-3">
          <label for="assignmentTitle">Assignment Title</label>
          <input type="text" id="assignmentTitle" class="form-control" placeholder="Enter assignment title" required>
        </div>
        <div class="mb-3">
          <label for="assignmentDescription">Description</label>
          <textarea id="assignmentDescription" class="form-control" placeholder="Enter assignment details" rows="3" required></textarea>
        </div>
        <div class="mb-3">
          <label for="dueDate">Due Date</label>
          <input type="date" id="dueDate" class="form-control" required>
        </div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Create Assignment</button>
        </div>
      </form>
    </div>

    <div class="section-divider"></div>

    <!-- Post Creation -->
    <div class="card p-4 mb-4">
      <h4 style="color:#ff8a65;">Create New Post</h4>
      <form id="postForm">
        <div class="mb-3">
          <label for="postTitle">Post Title</label>
          <input type="text" id="postTitle" class="form-control" placeholder="Enter post title" required>
        </div>
        <div class="mb-3">
          <label for="postContent">Content</label>
          <textarea id="postContent" class="form-control" placeholder="Enter post content" rows="3" required></textarea>
        </div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Create Post</button>
        </div>
      </form>
    </div>

    <div class="section-divider"></div>

    <!-- List of Assignments & Posts (example) -->
    <div class="card p-4 mb-4">
      <h4 style="color:#ff8a65;">Class Content</h4>
      <div id="contentList">
        <p class="text-muted">No assignments or posts yet.</p>
      </div>
    </div>
  </div>
</body>
</html>
