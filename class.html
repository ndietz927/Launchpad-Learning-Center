<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Class</title>

<style>
body { background:#0d0d0d; color:#fff; font-family:Arial; padding:20px;}
.item { background:#2c2c2c; padding:12px; border-radius:10px; margin-bottom:10px;}
button { background:#ff512f; border:none; padding:8px; cursor:pointer; }
.chat-box { max-height:300px; overflow-y:auto; background:#111; padding:10px; border-radius:10px;}
</style>
</head>

<body>

<h2 id="classHeader">Loading...</h2>

<h3>Create Assignment</h3>
<input id="title" placeholder="Title">
<textarea id="description" placeholder="Description"></textarea>
<input id="dueDate" type="date">
<button id="saveBtn">Save</button>

<h3>Assignments</h3>
<div id="contentList"></div>

<h3>Submissions</h3>
<div id="submissionPanel"></div>

<h3>Class Messages</h3>
<div id="chatBox" class="chat-box"></div>
<input id="chatInput" placeholder="Type message">
<button id="sendBtn">Send</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import {
 getFirestore,collection,doc,addDoc,onSnapshot,getDoc,updateDoc,
 query,orderBy,serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
 apiKey:"AIzaSyCCotUqgZkDULpRLeyb9lvCma_SYO0CFb0",
 authDomain:"simpleloginapp-a7b53.firebaseapp.com",
 projectId:"simpleloginapp-a7b53",
 storageBucket:"simpleloginapp-a7b53.firebasestorage.app",
 messagingSenderId:"410260892945",
 appId:"1:410260892945:web:5339e6de4dbf5cec2cf0b0"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

const classCode=new URLSearchParams(location.search).get("code");
const contentList=document.getElementById("contentList");
const submissionPanel=document.getElementById("submissionPanel");
const chatBox=document.getElementById("chatBox");
const chatInput=document.getElementById("chatInput");

let senderName="Teacher";
let senderRole="teacher";

/* ---------- AUTH ---------- */
onAuthStateChanged(auth,async user=>{
 if(!user) location.href="index.html";

 const teacherSnap=await getDoc(doc(db,"teacherProfiles",user.uid));
 if(teacherSnap.exists()){
   const t=teacherSnap.data();
   senderName=`${t.title} ${t.firstName} ${t.lastName}`;
 }

 loadClass();
 loadMessages();
});

/* ---------- LOAD CLASS ---------- */
async function loadClass(){
 const snap=await getDoc(doc(db,"classes",classCode));
 document.getElementById("classHeader").textContent = snap.data().name;
 loadAssignments();
}

function assignmentsRef(){
 return collection(db,"classes",classCode,"assignments");
}

function loadAssignments(){
 onSnapshot(assignmentsRef(),snap=>{
   contentList.innerHTML="";
   snap.forEach(docSnap=>{
     const a=docSnap.data();
     const div=document.createElement("div");
     div.className="item";
     div.innerHTML=`<b>${a.title}</b><p>${a.description}</p>`;
     div.onclick=()=>loadSubmissions(docSnap.id,a.title);
     contentList.appendChild(div);
   });
 });
}

/* ---------- SUBMISSIONS ---------- */
function loadSubmissions(id,title){
 const ref=collection(db,"classes",classCode,"assignments",id,"submissions");
 onSnapshot(ref,snap=>{
   submissionPanel.innerHTML=`<h4>${title}</h4>`;
   snap.forEach(s=>{
     const d=s.data();
     const div=document.createElement("div");
     div.className="item";
     div.innerHTML=`
      <p>${d.studentEmail}</p>
      <p>${d.submission}</p>
      <input placeholder="Grade" value="${d.grade||""}" id="g-${s.id}">
      <button>Save</button>
     `;
     div.querySelector("button").onclick=async()=>{
       await updateDoc(doc(db,"classes",classCode,"assignments",id,"submissions",s.id),{
         grade:document.getElementById(`g-${s.id}`).value
       });
       alert("Saved!");
     };
     submissionPanel.appendChild(div);
   });
 });
}

/* ---------- SAVE ASSIGNMENT ---------- */
saveBtn.onclick=async()=>{
 await addDoc(assignmentsRef(),{
  title:title.value,
  description:description.value,
  dueDate:dueDate.value
 });
};

/* ---------- MESSAGING ---------- */
function messagesRef(){
 return collection(db,"classes",classCode,"messages");
}

function loadMessages(){
 const q=query(messagesRef(),orderBy("timestamp"));
 onSnapshot(q,snap=>{
  chatBox.innerHTML="";
  snap.forEach(d=>{
   const m=d.data();
   const t=m.timestamp?.toDate()?.toLocaleString()||"";
   chatBox.innerHTML+=`
    <div>
     <strong>${m.senderName}</strong>
     <small>(${t})</small>
     <div>${m.message}</div>
     <hr/>
    </div>`;
  });
  chatBox.scrollTop=chatBox.scrollHeight;
 });
}

sendBtn.onclick=async()=>{
 if(!chatInput.value) return;
 await addDoc(messagesRef(),{
  senderName,
  senderRole,
  message:chatInput.value,
  timestamp:serverTimestamp()
 });
 chatInput.value="";
};
</script>
</body>
</html>
