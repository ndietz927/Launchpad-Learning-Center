<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Loading...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #0d0d0d;
      color: #fff;
      min-height: 100vh;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #ff512f, #dd2476);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: #1c1c1c;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 0 25px rgba(221, 36, 118, 0.25);
      margin-bottom: 30px;
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 15px;
      color: #ffb199;
    }

    input, textarea {
      width: 100%;
      background-color: #2b2b2b;
      color: #fff;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      margin-bottom: 15px;
      font-family: inherit;
    }

    input::placeholder,
    textarea::placeholder {
      color: #aaa;
    }

    button {
      background: linear-gradient(135deg, #ff512f, #dd2476);
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
    }

    button:hover {
      background: linear-gradient(135deg, #dd2476, #ff512f);
    }

    .content-item {
      background-color: #2b2b2b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
      border-left: 4px solid #ff8a65;
      position: relative;
    }

    .content-item h3 {
      margin: 0 0 6px;
      color: #ffb199;
    }

    .content-item small {
      color: #aaa;
    }

    .actions {
      position: absolute;
      top: 14px;
      right: 14px;
    }

    .actions button {
      background: none;
      border: none;
      color: #ff8a65;
      font-weight: 600;
      margin-left: 10px;
      cursor: pointer;
    }

    .actions button:hover {
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 id="classTitle">Loading...</h1>

    <!-- Add Assignment -->
    <div class="card">
      <h2>Add Assignment</h2>
      <form id="assignmentForm">
        <input type="hidden" id="editIndex">
        <input id="title" placeholder="Assignment title" required />
        <textarea id="description" placeholder="Description" required></textarea>
        <input id="dueDate" type="date" required />
        <button type="submit">Save Assignment</button>
      </form>
    </div>

    <!-- Class Content -->
    <div class="card">
      <h2>Class Content</h2>
      <div id="assignmentsContainer"></div>
    </div>
  </div>

  <script>
    // Get class code from URL
    const params = new URLSearchParams(window.location.search);
    const classCode = params.get("code");

    // Load class name
    const className = localStorage.getItem(`className_${classCode}`);
    if (className) {
      document.title = className;
      document.getElementById("classTitle").textContent = className;
    }

    const form = document.getElementById("assignmentForm");
    const container = document.getElementById("assignmentsContainer");

    let assignments = JSON.parse(localStorage.getItem(`assignments_${classCode}`)) || [];

    function renderAssignments() {
      container.innerHTML = "";
      assignments.forEach((a, i) => {
        const div = document.createElement("div");
        div.className = "content-item";
        div.innerHTML = `
          <h3>${a.title}</h3>
          <p>${a.description}</p>
          <small>Due: ${a.dueDate}</small>
          <div class="actions">
            <button onclick="edit(${i})">Edit</button>
            <button onclick="remove(${i})">Delete</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    form.addEventListener("submit", e => {
      e.preventDefault();

      const title = titleInput.value;
      const description = descriptionInput.value;
      const dueDate = dueDateInput.value;
      const editIndex = editIndexInput.value;

      if (editIndex === "") {
        assignments.push({ title, description, dueDate });
      } else {
        assignments[editIndex] = { title, description, dueDate };
      }

      localStorage.setItem(`assignments_${classCode}`, JSON.stringify(assignments));
      form.reset();
      editIndexInput.value = "";
      renderAssignments();
    });

    function edit(i) {
      const a = assignments[i];
      titleInput.value = a.title;
      descriptionInput.value = a.description;
      dueDateInput.value = a.dueDate;
      editIndexInput.value = i;
    }

    function remove(i) {
      if (!confirm("Delete this item?")) return;
      assignments.splice(i, 1);
      localStorage.setItem(`assignments_${classCode}`, JSON.stringify(assignments));
      renderAssignments();
    }

    renderAssignments();
  </script>
</body>
</html>
