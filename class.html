<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Class Dashboard</title>
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>
<style>
body { font-family: Arial, sans-serif; background:#0d0d0d; color:#fff; margin:0; padding:20px; }
h1,h2,h3,h4 { color:#ff8a65; text-align:center; }
.card, .roster-card { background:#1c1c1c; padding:20px; border-radius:14px; margin:20px auto; max-width:800px; box-shadow:0 0 25px rgba(255,94,77,0.3);}
input, textarea, select, button { width:100%; padding:10px; margin-top:10px; border-radius:8px; border:1px solid #444; background:#2c2c2c; color:#fff; }
button { background: linear-gradient(135deg,#ff512f,#dd2476); border:none; color:#fff; font-weight:bold; cursor:pointer; }
button:hover { background: linear-gradient(135deg,#dd2476,#ff512f); }
.assignment { border-left:6px solid #ff512f; margin-bottom:10px; padding:10px; border-radius:8px; }
.post { border-left:6px solid #6c757d; margin-bottom:10px; padding:10px; border-radius:8px; }
.submit-btn { margin-top:10px; }
table { width:100%; color:#fff; border-collapse: collapse; }
th,td { padding:8px; border-bottom:1px solid #444; text-align:left; }
th { color:#ff8a65; }
</style>
</head>

<body>

<h1 id="classHeader">Loading Class...</h1>

<div class="card">
  <h2>Create Assignment / Post</h2>
  <select id="contentType">
    <option value="assignment">Assignment</option>
    <option value="post">Post</option>
  </select>
  <input type="text" id="title" placeholder="Title" />
  <textarea id="description" placeholder="Description"></textarea>
  <input type="date" id="dueDate" />
  <button id="saveBtn">Upload</button>
</div>

<div class="card">
  <h2>Class Content</h2>
  <div id="contentList"></div>
</div>

<div class="roster-card">
  <h2>Student Roster & Grade Averages</h2>
  <table id="rosterTable">
    <thead>
      <tr>
        <th>Student</th>
        <th>Email</th>
        <th>Average Grade</th>
      </tr>
    </thead>
    <tbody id="rosterBody"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import {
  getFirestore, doc, collection, addDoc, onSnapshot,
  getDocs, setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCotUqgZkDULpRLeyb9lvCma_SYO0CFb0",
  authDomain: "simpleloginapp-a7b53.firebaseapp.com",
  projectId: "simpleloginapp-a7b53",
  storageBucket: "simpleloginapp-a7b53.firebasestorage.app",
  messagingSenderId: "410260892945",
  appId: "1:410260892945:web:5339e6de4dbf5cec2cf0b0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* ----- Elements ----- */
const classHeader = document.getElementById("classHeader");
const contentList = document.getElementById("contentList");
const saveBtn = document.getElementById("saveBtn");
const titleInput = document.getElementById("title");
const descriptionInput = document.getElementById("description");
const dueDateInput = document.getElementById("dueDate");
const typeSelect = document.getElementById("contentType");

const rosterBody = document.getElementById("rosterBody");

let editId = null;
const classCode = new URLSearchParams(window.location.search).get("code");

/* ----- Auth ----- */
onAuthStateChanged(auth, async (user) => {
  if(!user) { window.location.href="index.html"; return; }

  await loadClassInfo();
  loadContent();
  loadRoster();
});

/* ----- Load Class Info ----- */
async function loadClassInfo() {
  const snap = await getDoc(doc(db, "classes", classCode));
  if(!snap.exists()) {
    classHeader.textContent = "Class Not Found";
    return;
  }
  classHeader.textContent = snap.data().name;
}

/* ----- Load & Render Content ----- */
function loadContent() {
  const assignmentsRef = collection(db, "classes", classCode, "assignments");
  onSnapshot(assignmentsRef, snapshot => {
    contentList.innerHTML = "";
    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      const div = document.createElement("div");
      div.className = data.type==="assignment" ? "assignment" : "post";
      div.innerHTML = `<h4>${data.title}</h4><p>${data.description}</p><small>Due: ${data.dueDate||"N/A"}</small>`;
      contentList.appendChild(div);
    });
  });
}

/* ----- Create Assignment/Post ----- */
saveBtn.onclick = async () => {
  const data = {
    title: titleInput.value.trim(),
    description: descriptionInput.value.trim(),
    dueDate: typeSelect.value==="assignment"? dueDateInput.value : "",
    type: typeSelect.value,
    createdAt: Date.now()
  };

  if(!data.title || !data.description) return alert("Fill all fields");

  await addDoc(collection(db, "classes", classCode, "assignments"), data);

  titleInput.value=""; descriptionInput.value=""; dueDateInput.value="";
};

/* ----- Load Roster & Calculate Grade Averages ----- */
async function loadRoster() {
  rosterBody.innerHTML = "";

  // Get all students with this classCode
  const profilesSnap = await getDocs(collection(db, "profiles"));
  const students = [];
  profilesSnap.forEach(docSnap => {
    const d = docSnap.data();
    if(d.classCode === classCode) students.push({ uid: docSnap.id, ...d });
  });

  // For each student, calculate average grade
  for(const student of students) {
    let grades = [];
    const assignmentsSnap = await getDocs(collection(db, "classes", classCode, "assignments"));
    for(const aDoc of assignmentsSnap.docs) {
      const subSnap = await getDoc(doc(db, "classes", classCode, "assignments", aDoc.id, "submissions", student.uid));
      if(subSnap.exists()) {
        const g = subSnap.data().grade;
        if(g!==undefined && g!=="") grades.push(parseFloat(g));
      }
    }
    const avgGrade = grades.length>0 ? (grades.reduce((a,b)=>a+b,0)/grades.length).toFixed(2) : "N/A";

    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${student.firstName} ${student.lastName}</td>
                    <td>${student.email}</td>
                    <td>${avgGrade}</td>`;
    rosterBody.appendChild(tr);
  }
}
</script>
</body>
</html>
