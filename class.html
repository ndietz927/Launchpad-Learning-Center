<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loading...</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background-color: #f0f2f5;
}

h1 {
    text-align: center;
}

.form-box, .content-box {
    background: white;
    padding: 15px;
    border-radius: 10px;
    max-width: 800px;
    margin: 20px auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input, textarea, select, button {
    width: 100%;
    padding: 8px;
    margin-top: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    background-color: #007bff;
    color: white;
    border: none;
    cursor: pointer;
}
button:hover { background-color: #0056b3; }

.item {
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 12px;
    position: relative;
    background: #fafafa;
}

.assignment {
    border-left: 6px solid #007bff;
}

.assignment.upcoming {
    background: #e8f1ff;
}

.assignment.overdue {
    background: #ffecec;
    border-left-color: #dc3545;
}

.post {
    border-left: 6px solid #6c757d;
}

.item h3 {
    margin: 0;
}

.item small {
    color: #555;
}

.actions {
    margin-top: 10px;
}

.actions button {
    width: auto;
    padding: 5px 10px;
    margin-right: 5px;
    border-radius: 4px;
}

.edit-btn {
    background-color: #ffc107;
    color: #000;
}

.delete-btn {
    background-color: #dc3545;
    color: white;
}
</style>
</head>

<body>

<h1 id="classHeader">Loading...</h1>

<div class="form-box">
    <h2>Create Assignment / Post</h2>

    <select id="contentType">
        <option value="assignment">Assignment</option>
        <option value="post">Post</option>
    </select>

    <input type="text" id="title" placeholder="Title" />
    <textarea id="description" placeholder="Description"></textarea>
    <input type="date" id="dueDate" />

    <button id="saveBtn">Upload</button>
</div>

<div class="content-box">
    <h2>Class Content</h2>
    <div id="contentList"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {
    getFirestore, collection, doc, addDoc, onSnapshot,
    updateDoc, deleteDoc, getDoc
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

/* 🔥 Firebase Config (same as teacher.html) */
const firebaseConfig = {
    apiKey: "AIzaSyCCotUqgZkDULpRLeyb9lvCma_SYO0CFb0",
    authDomain: "simpleloginapp-a7b53.firebaseapp.com",
    projectId: "simpleloginapp-a7b53",
    storageBucket: "simpleloginapp-a7b53.firebasestorage.app",
    messagingSenderId: "410260892945",
    appId: "1:410260892945:web:5339e6de4dbf5cec2cf0b0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* ----- URL class code ----- */
const classCode = new URLSearchParams(window.location.search).get("code");

/* ----- Elements ----- */
const classHeader = document.getElementById("classHeader");
const contentList = document.getElementById("contentList");
const saveBtn = document.getElementById("saveBtn");

const titleInput = document.getElementById("title");
const descriptionInput = document.getElementById("description");
const dueDateInput = document.getElementById("dueDate");
const typeSelect = document.getElementById("contentType");

let editId = null;

/* ----- Auth gate (NO redirect bug) ----- */
onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "index.html";
        return;
    }
    await loadClassName();
    loadContent();
});

/* ----- Load class name ----- */
async function loadClassName() {
    const snap = await getDoc(doc(db, "classes", classCode));
    if (!snap.exists()) {
        classHeader.textContent = "Class Not Found";
        return;
    }
    const name = snap.data().name;
    classHeader.textContent = name;
    document.title = name;
}

/* ----- Load & sort content ----- */
function loadContent() {
    onSnapshot(collection(db, "classContent"), (snapshot) => {
        let items = [];

        snapshot.forEach(docSnap => {
            const data = docSnap.data();
            if (data.classCode === classCode) {
                items.push({ id: docSnap.id, ...data });
            }
        });

        // Sort: assignments by due date first
        items.sort((a, b) => {
            if (a.type === "assignment" && b.type === "assignment") {
                return new Date(a.dueDate || 0) - new Date(b.dueDate || 0);
            }
            if (a.type === "assignment") return -1;
            if (b.type === "assignment") return 1;
            return 0;
        });

        renderItems(items);
    });
}

/* ----- Render ----- */
function renderItems(items) {
    contentList.innerHTML = "";
    const today = new Date().toISOString().split("T")[0];

    items.forEach(item => {
        const div = document.createElement("div");

        let classes = "item " + item.type;
        if (item.type === "assignment") {
            if (item.dueDate < today) classes += " overdue";
            else classes += " upcoming";
        }

        div.className = classes;
        div.innerHTML = `
            <h3>${item.title}</h3>
            <p>${item.description}</p>
            ${item.type === "assignment" ? `<small>Due: ${item.dueDate}</small>` : ""}
            <div class="actions">
                <button class="edit-btn">Edit</button>
                <button class="delete-btn">Delete</button>
            </div>
        `;

        div.querySelector(".edit-btn").onclick = () => {
            titleInput.value = item.title;
            descriptionInput.value = item.description;
            dueDateInput.value = item.dueDate || "";
            typeSelect.value = item.type;
            editId = item.id;
        };

        div.querySelector(".delete-btn").onclick = async () => {
            if (confirm("Delete this item?")) {
                await deleteDoc(doc(db, "classContent", item.id));
            }
        };

        contentList.appendChild(div);
    });
}

/* ----- Save / Edit ----- */
saveBtn.onclick = async () => {
    const data = {
        classCode,
        title: titleInput.value.trim(),
        description: descriptionInput.value.trim(),
        dueDate: typeSelect.value === "assignment" ? dueDateInput.value : "",
        type: typeSelect.value,
        createdAt: Date.now()
    };

    if (!data.title || !data.description) {
        alert("Please fill all fields");
        return;
    }

    if (editId) {
        await updateDoc(doc(db, "classContent", editId), data);
        editId = null;
    } else {
        await addDoc(collection(db, "classContent"), data);
    }

    titleInput.value = "";
    descriptionInput.value = "";
    dueDateInput.value = "";
};
</script>

</body>
</html>
