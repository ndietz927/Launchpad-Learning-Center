<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import {
    getFirestore, doc, setDoc, addDoc, collection, onSnapshot, deleteDoc, updateDoc
  } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCCotUqgZkDULpRLeyb9lvCma_SYO0CFb0",
    authDomain: "simpleloginapp-a7b53.firebaseapp.com",
    projectId: "simpleloginapp-a7b53",
    storageBucket: "simpleloginapp-a7b53.firebasestorage.app",
    messagingSenderId: "410260892945",
    appId: "1:410260892945:web:5339e6de4dbf5cec2cf0b0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const params = new URLSearchParams(window.location.search);
  let classCode = params.get("code");

  if (!classCode) {
    alert("Class code missing. Return to your teacher dashboard.");
    window.location.href = "teacher.html";
  }

  classCode = decodeURIComponent(classCode).trim();
  document.getElementById("classCodeDisplay").textContent = "Class Code: " + classCode;

  const assignmentForm = document.getElementById("assignmentForm");
  const assignmentList = document.getElementById("assignmentList");
  const assignmentStatus = document.getElementById("assignmentStatus");

  // CREATE ASSIGNMENT
  assignmentForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const title = document.getElementById("title").value;
    const description = document.getElementById("description").value;
    const dueDate = document.getElementById("dueDate").value;
    const gradeScale = document.getElementById("gradeScale").value;
    const formLink = document.getElementById("formLink").value;
    const docLink = document.getElementById("docLink").value;

    try {
      await addDoc(collection(db, "classes", classCode, "assignments"), {
        title,
        description,
        dueDate,
        gradeScale,
        formLink,
        docLink,
        completed: false,
        createdAt: new Date().toISOString()
      });

      assignmentStatus.textContent = "✅ Assignment created!";
      assignmentForm.reset();
    } catch (err) {
      assignmentStatus.textContent = "❌ Error creating assignment.";
      console.error(err);
    }
  });

  // LIST ASSIGNMENTS
  onSnapshot(collection(db, "classes", classCode, "assignments"), (snapshot) => {
    assignmentList.innerHTML = "";

    if (snapshot.empty) {
      assignmentList.innerHTML = `<p class="text-muted">No assignments yet.</p>`;
      return;
    }

    snapshot.forEach((docSnap) => {
      const a = docSnap.data();
      const id = docSnap.id;

      // skip if marked deleted
      if (a.deleted) return;

      assignmentList.innerHTML += `
        <div class="p-3 mb-3 border rounded ${a.completed ? 'bg-success bg-opacity-10' : ''}">
          <strong>${a.title}</strong><br>
          <small>Due: ${a.dueDate}</small><br>
          <small>Scale: ${a.gradeScale} points</small>
          <p class="mt-2">${a.description}</p>

          ${a.formLink ? `<a href="${a.formLink}" target="_blank" class="text-info">Google Form</a><br>` : ""}
          ${a.docLink ? `<a href="${a.docLink}" target="_blank" class="text-info">Google Doc</a><br>` : ""}

          <button class="btn btn-danger btn-sm mt-2" onclick="deleteAssignment('${id}')">Delete</button>
          <button class="btn btn-warning btn-sm mt-2" onclick="editAssignment('${id}')">Edit</button>
          <button class="btn btn-success btn-sm mt-2" onclick="toggleCompleted('${id}', ${a.completed})">
            ${a.completed ? 'Mark Incomplete' : 'Mark Completed'}
          </button>
        </div>
      `;
    });
  });

  // DELETE ASSIGNMENT
  window.deleteAssignment = async (id) => {
    if (!confirm("Are you sure you want to delete this assignment?")) return;
    await deleteDoc(doc(db, "classes", classCode, "assignments", id));
  };

  // TOGGLE COMPLETED
  window.toggleCompleted = async (id, current) => {
    await updateDoc(doc(db, "classes", classCode, "assignments", id), {
      completed: !current
    });
  };

  // EDIT ASSIGNMENT
  window.editAssignment = async (id) => {
    const docRef = doc(db, "classes", classCode, "assignments", id);
    const docSnap = await getDoc(docRef);
    if (!docSnap.exists()) return;

    const a = docSnap.data();
    const newTitle = prompt("Edit Title", a.title);
    const newDescription = prompt("Edit Description", a.description);
    if (newTitle !== null && newDescription !== null) {
      await updateDoc(docRef, {
        title: newTitle,
        description: newDescription
      });
    }
  };
</script>
