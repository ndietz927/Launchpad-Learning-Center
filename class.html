<script type="module">
    // ------------------ FIREBASE INIT ------------------
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
        getFirestore, collection, addDoc,
        onSnapshot, doc, updateDoc, deleteDoc
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // ---- YOUR FIREBASE CONFIG ----
    const firebaseConfig = {
        apiKey: "YOUR_KEY",
        authDomain: "YOUR_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_BUCKET",
        messagingSenderId: "YOUR_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const contentRef = collection(db, "classContent");

    // ------------------ SAVE CONTENT ------------------
    window.saveContent = async function () {
        const type = document.getElementById("contentType").value;
        const title = document.getElementById("title").value.trim();
        const description = document.getElementById("description").value.trim();
        const dueDateInput = document.getElementById("dueDate").value;

        if (title === "" || description === "") {
            alert("Please fill in the title and description.");
            return;
        }

        const dueDate = type === "assignment" ? dueDateInput : "";

        try {
            await addDoc(contentRef, {
                type,
                title,
                description,
                dueDate,
                timestamp: Date.now()
            });

            // CLEAR FIELDS
            document.getElementById("title").value = "";
            document.getElementById("description").value = "";
            document.getElementById("dueDate").value = "";

        } catch (err) {
            console.error("ERROR SAVING:", err);
        }
    };

    // ------------------ DISPLAY CONTENT ------------------
    onSnapshot(contentRef, (snapshot) => {
        const list = document.getElementById("contentList");
        list.innerHTML = "";

        snapshot.forEach((docSnap) => {
            const item = docSnap.data();
            const id = docSnap.id;

            const div = document.createElement("div");
            div.className = "item";

            div.innerHTML = `
                <h3>${item.title}</h3>
                <p>${item.description}</p>
                ${item.type === "assignment" && item.dueDate ? `<small>Due: ${item.dueDate}</small>` : ""}
                <div class="actions">
                    <button class="edit-btn" onclick="editItem('${id}')">Edit</button>
                    <button class="delete-btn" onclick="deleteItem('${id}')">Delete</button>
                </div>
            `;

            list.appendChild(div);
        });
    });

    // ------------------ EDIT CONTENT ------------------
    window.editItem = function (id) {
        const docRef = doc(db, "classContent", id);

        // Load data to form
        const itemBox = document.querySelector(`button[onclick="editItem('${id}')"]`).parentElement.parentElement;

        const title = itemBox.querySelector("h3").innerText;
        const description = itemBox.querySelector("p").innerText;
        const dueText = itemBox.querySelector("small")?.innerText || "";
        const dueDate = dueText.replace("Due: ", "");

        document.getElementById("title").value = title;
        document.getElementById("description").value = description;
        document.getElementById("dueDate").value = dueDate;

        // Override save button for editing
        window.saveContent = async function () {
            const newTitle = document.getElementById("title").value.trim();
            const newDesc = document.getElementById("description").value.trim();
            const newDue = document.getElementById("dueDate").value;

            await updateDoc(docRef, {
                title: newTitle,
                description: newDesc,
                dueDate: newDue
            });

            // Restore normal behavior
            location.reload();
        };
    };

    // ------------------ DELETE CONTENT ------------------
    window.deleteItem = async function (id) {
        if (confirm("Delete this item?")) {
            await deleteDoc(doc(db, "classContent", id));
        }
    };

    // ------------------ SET CLASS NAME ------------------
    window.setClassName = function () {
        const name = document.getElementById("classNameInput").value.trim();
        if (name === "") return;
        document.title = name;
        document.getElementById("classHeader").textContent = name;
    };
</script>
