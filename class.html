<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loading...</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: #0d0d0d;
    color: #fff;
}

h1, h2, h3 {
    text-align: center;
    color: #ff8a65;
}

.form-box, .content-box {
    background: #1c1c1c;
    padding: 20px;
    border-radius: 14px;
    max-width: 900px;
    margin: 20px auto;
    box-shadow: 0 0 25px rgba(255, 94, 77, 0.3);
}

input, textarea, select, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid #444;
    background-color: #2c2c2c;
    color: #fff;
}

button {
    background: linear-gradient(135deg, #ff512f, #dd2476);
    border: none;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: linear-gradient(135deg, #dd2476, #ff512f);
}

.item {
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    background: #2c2c2c;
}

.assignment { border-left: 6px solid #ff512f; }
.post { border-left: 6px solid #6c757d; }

.actions button {
    width: auto;
    margin-right: 5px;
}

.edit-btn { background: #ffc107; color: #000; }
.delete-btn { background: #dc3545; }
.view-submissions-btn { background: #0dcaf0; color: #000; }
.save-grade-btn { background: #198754; }

#rosterTable {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}
#rosterTable th, #rosterTable td {
    border: 1px solid #444;
    padding: 8px;
    text-align: center;
}
#rosterTable th {
    background-color: #333;
}

/* ---------- Messaging ---------- */
#messagesBox {
    max-height: 300px;
    overflow-y: auto;
    margin-bottom: 10px;
}
.message {
    background: #2c2c2c;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 8px;
}
.message small {
    color: #aaa;
}
</style>
</head>

<body>

<h1 id="classHeader">Loading...</h1>

<div class="form-box">
    <h2>Create Assignment / Post</h2>

    <select id="contentType">
        <option value="assignment">Assignment</option>
        <option value="post">Post</option>
    </select>

    <input type="text" id="title" placeholder="Title" />
    <textarea id="description" placeholder="Description"></textarea>
    <input type="date" id="dueDate" />

    <button id="saveBtn">Upload</button>
</div>

<div class="content-box">
    <h2>Class Content</h2>
    <div id="contentList"></div>
</div>

<div class="content-box">
    <h2>Student Submissions</h2>
    <div id="submissionPanel">
        <p style="color:#aaa;">Select an assignment to view submissions.</p>
    </div>
</div>

<div class="content-box">
    <h2>Student Roster & Grade Averages</h2>
    <div id="rosterPanel">
        <p style="color:#aaa;">Roster will appear here.</p>
        <table id="rosterTable">
            <thead>
                <tr>
                    <th>Student</th>
                    <th>Email</th>
                    <th>Assignments Submitted</th>
                    <th>Average Grade</th>
                </tr>
            </thead>
            <tbody id="rosterBody"></tbody>
        </table>
    </div>
</div>

<!-- ✅ Messaging Panel -->
<div class="content-box">
    <h2>Class Messages</h2>

    <div id="messagesBox"></div>

    <input id="messageInput" placeholder="Type a message..." />
    <button id="sendMessageBtn">Send Message</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {
    getFirestore,
    collection,
    doc,
    addDoc,
    onSnapshot,
    updateDoc,
    deleteDoc,
    getDoc,
    getDocs,
    query,
    where,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyCCotUqgZkDULpRLeyb9lvCma_SYO0CFb0",
    authDomain: "simpleloginapp-a7b53.firebaseapp.com",
    projectId: "simpleloginapp-a7b53",
    storageBucket: "simpleloginapp-a7b53.firebasestorage.app",
    messagingSenderId: "410260892945",
    appId: "1:410260892945:web:5339e6de4dbf5cec2cf0b0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const classCode = new URLSearchParams(window.location.search).get("code");

/* ---------- DOM ---------- */
const classHeader = document.getElementById("classHeader");
const contentList = document.getElementById("contentList");
const submissionPanel = document.getElementById("submissionPanel");
const rosterBody = document.getElementById("rosterBody");

const saveBtn = document.getElementById("saveBtn");
const titleInput = document.getElementById("title");
const descriptionInput = document.getElementById("description");
const dueDateInput = document.getElementById("dueDate");
const typeSelect = document.getElementById("contentType");

/* ---------- Messaging DOM ---------- */
const messagesBox = document.getElementById("messagesBox");
const messageInput = document.getElementById("messageInput");
const sendMessageBtn = document.getElementById("sendMessageBtn");

let editId = null;
let currentUser = null;

/* ---------- AUTH ---------- */
onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "index.html";
        return;
    }

    currentUser = user;

    await loadClassName();
    loadAssignments();
    loadRoster();
    loadMessages();   // ✅ Start listening for messages
});

/* ---------- MESSAGES ---------- */
function messagesRef() {
    return collection(db, "classes", classCode, "messages");
}

function loadMessages() {
    const q = query(messagesRef(), orderBy("createdAt"));

    onSnapshot(q, (snapshot) => {
        messagesBox.innerHTML = "";

        snapshot.forEach(docSnap => {
            const msg = docSnap.data();
            const div = document.createElement("div");
            div.className = "message";

            const time = msg.createdAt?.toDate
                ? msg.createdAt.toDate().toLocaleString()
                : "";

            div.innerHTML = `
                <strong>${msg.senderName}</strong><br>
                ${msg.text}<br>
                <small>${time}</small>
            `;

            messagesBox.appendChild(div);
        });

        messagesBox.scrollTop = messagesBox.scrollHeight;
    });
}

sendMessageBtn.onclick = async () => {
    const text = messageInput.value.trim();
    if (!text) return;

    await addDoc(messagesRef(), {
        text,
        senderId: currentUser.uid,
        senderName: currentUser.email,
        createdAt: serverTimestamp()
    });

    messageInput.value = "";
};

/* NOTHING ELSE WAS MODIFIED */
</script>

</body>
</html>
