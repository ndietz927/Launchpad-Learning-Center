<!DOCTYPE html>
<html>
<head>
  <title>Skill Share Messaging</title>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #121212;
      color: white;
      padding-top: 80px;
    }

    .card {
      background-color: #1f1f1f;
      border-radius: 10px;
    }

    input, textarea {
      background-color: #2a2a2a !important;
      color: white !important;
      border: none;
    }

    .user-item {
      cursor: pointer;
      padding: 10px;
      border-bottom: 1px solid #333;
    }

    .user-item:hover {
      background-color: #2f2f2f;
    }

    .chat-box {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      background-color: #181818;
      border-radius: 5px;
    }

    .message {
      color: #ffffff;
      margin-bottom: 10px;
    }

    .message small {
      color: #bbbbbb;
    }

    .badge {
      font-size: 0.8rem;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark fixed-top bg-dark">
  <div class="container-fluid d-flex justify-content-between align-items-center">

    <span class="navbar-brand fw-bold fs-4">Skill Share Messaging</span>

    <div class="d-flex align-items-center gap-3">
      <div id="notificationBadge" class="badge bg-danger" style="display:none;">
        New Messages
      </div>

      <button onclick="history.back()" class="btn btn-outline-light btn-sm">
        ⬅ Back
      </button>
    </div>

  </div>
</nav>

<div class="container">

  <!-- PROFILE CARD -->
  <div class="card p-3 mb-3">
    <h5>Your Profile</h5>
    <textarea id="profileText" class="form-control mb-2" rows="3"
      placeholder="Teachers: Describe your class | Students: Enter your interests"></textarea>
    <button id="saveProfileBtn" class="btn btn-success btn-sm">Save</button>
  </div>

  <div class="row">

    <!-- USER LIST -->
    <div class="col-md-4">
      <div class="card p-3">
        <h5>Connect With</h5>
        <div id="userList"></div>
      </div>
    </div>

    <!-- CHAT -->
    <div class="col-md-8">
      <div class="card p-3">
        <h5 id="chatTitle">Select a user</h5>

        <div id="chatBox" class="chat-box mb-2"></div>

        <div class="d-flex gap-2">
          <input id="messageInput" class="form-control" placeholder="Type message...">
          <button id="sendBtn" class="btn btn-primary">Send</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- FIREBASE SCRIPT -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, getDoc, getDocs,
  addDoc, onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";


// 🔥 YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);


// ELEMENTS
const profileText = document.getElementById("profileText");
const saveProfileBtn = document.getElementById("saveProfileBtn");
const userList = document.getElementById("userList");
const chatBox = document.getElementById("chatBox");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const chatTitle = document.getElementById("chatTitle");
const notificationBadge = document.getElementById("notificationBadge");

let currentUser = null;
let selectedUser = null;
let unsubscribeChat = null;
let unreadCount = 0;


// LOGIN CHECK
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }

  currentUser = user;
  loadMyProfile();
  loadUsers();
  listenForNotifications();
});


// SAVE PROFILE
saveProfileBtn.addEventListener("click", async () => {
  const text = profileText.value.trim();
  if (!text) return alert("Enter something first!");

  await setDoc(doc(db, "connectionsProfiles", currentUser.uid), {
    text,
    email: currentUser.email
  });

  alert("Profile saved!");
});


// LOAD MY PROFILE
async function loadMyProfile() {
  const snap = await getDoc(doc(db, "connectionsProfiles", currentUser.uid));
  if (snap.exists()) {
    profileText.value = snap.data().text;
  }
}


// LOAD USERS
async function loadUsers() {
  const snap = await getDocs(collection(db, "connectionsProfiles"));
  userList.innerHTML = "";

  snap.forEach(docSnap => {
    if (docSnap.id === currentUser.uid) return;

    const user = docSnap.data();
    const div = document.createElement("div");
    div.className = "user-item";
    div.innerHTML = `
      <strong>${user.email}</strong><br>
      <small>${user.text}</small>
    `;
    div.onclick = () => openChat({ uid: docSnap.id, ...user });
    userList.appendChild(div);
  });
}


// OPEN CHAT
function openChat(user) {
  selectedUser = user;
  chatTitle.textContent = `Chat with ${user.email}`;
  chatBox.innerHTML = "";
  updateNotificationBadge(0);

  const chatId = [currentUser.uid, user.uid].sort().join("_");
  const messagesRef = collection(db, "chats", chatId, "messages");
  const q = query(messagesRef, orderBy("timestamp"));

  if (unsubscribeChat) unsubscribeChat();

  unsubscribeChat = onSnapshot(q, (snapshot) => {
    chatBox.innerHTML = "";
    snapshot.forEach(doc => {
      const msg = doc.data();
      const div = document.createElement("div");
      const time = msg.timestamp?.toDate().toLocaleString() || "";
      div.className = "message";
      div.innerHTML = `
        <strong>${msg.senderName}</strong>: ${msg.text}<br>
        <small>${time}</small>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  });
}


// SEND MESSAGE
sendBtn.addEventListener("click", sendMessage);

async function sendMessage() {
  if (!selectedUser) return alert("Select someone first!");
  const text = messageInput.value.trim();
  if (!text) return;

  const chatId = [currentUser.uid, selectedUser.uid].sort().join("_");
  const messagesRef = collection(db, "chats", chatId, "messages");

  await addDoc(messagesRef, {
    text,
    sender: currentUser.email,
    senderName: currentUser.email,
    timestamp: serverTimestamp()
  });

  messageInput.value = "";
}


// NOTIFICATIONS
function listenForNotifications() {
  const chatsRef = collection(db, "chats");

  onSnapshot(chatsRef, (snapshot) => {
    snapshot.docChanges().forEach(change => {
      if (change.type === "added") {
        const chatId = change.doc.id;
        const messagesRef = collection(db, "chats", chatId, "messages");

        onSnapshot(messagesRef, (msgSnap) => {
          msgSnap.docChanges().forEach(msgChange => {
            if (msgChange.type === "added") {
              const msg = msgChange.doc.data();
              if (msg.sender !== currentUser.email) {
                unreadCount++;
                updateNotificationBadge(unreadCount);
              }
            }
          });
        });
      }
    });
  });
}

function updateNotificationBadge(count) {
  if (count > 0) {
    notificationBadge.style.display = "block";
    notificationBadge.textContent = `🔔 ${count} New`;
  } else {
    notificationBadge.style.display = "none";
  }
}

</script>

</body>
</html>
