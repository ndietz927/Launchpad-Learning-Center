<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkillSwap Login</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #0d0d0d;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }
      .card {
        background: #1c1c1c;
        color: #fff;
        border: none;
        border-radius: 14px;
        box-shadow: 0 0 25px rgba(255, 94, 77, 0.3);
        max-width: 400px;
        width: 100%;
      }
      .logo {
        width: 270px;
        margin-bottom: 25px;
      }
      .btn-primary {
        background: linear-gradient(135deg, #ff512f, #dd2476);
        border: none;
      }
      .btn-primary:hover {
        background: linear-gradient(135deg, #dd2476, #ff512f);
      }
      .btn-outline-light {
        border: 1px solid #ff512f;
        color: #ff512f;
      }
      .btn-outline-light:hover {
        background-color: #ff512f;
        color: #fff;
      }
      .google-btn {
        background-color: #fff;
        color: #222;
        border: none;
      }
      .google-btn img {
        width: 22px;
        margin-right: 8px;
      }
      .google-btn:hover {
        background-color: #f3f3f3;
      }
      footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #111;
  border-top: 1px solid rgba(255, 94, 77, 0.3);
  color: #bbb;
  font-size: 0.7rem; /* smaller font */
  padding: 6px 0;
}

.footer-content {
  text-align: center;
  line-height: 1.3;
}

footer span.highlight {
  color: #ff8a65;
  font-weight: 600;
}

    </style>
  </head>

  <body>
    <div class="container-fluid d-flex justify-content-center align-items-center">
      <div class="card p-4 text-center">
        <img
          src="Launchpad Learning Center.png"
          alt="Launchpad Logo"
          class="logo mx-auto d-block img-fluid"
        />
        <h3 class="mb-3 fw-bold" style="color: #ff8a65;">
          SkillSwap Learning Center
        </h3>
        <p class="text-light">Sign in to continue</p>

        <!-- Email + Password -->
        <div class="mb-3">
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="Email"
          />
        </div>
        <div class="mb-3">
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Password"
          />
        </div>

        <!-- Role Selector -->
        <div class="mb-3">
          <label for="role" class="form-label">Select your role:</label>
          <select id="role" class="form-select text-dark">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="admin">Administrator</option>
          </select>
        </div>

        <!-- Login/Register -->
        <div class="d-grid gap-2 mb-3">
          <button id="login" class="btn btn-primary">Login</button>
          <button id="register" class="btn btn-outline-light">Register</button>
        </div>

        <!-- Google Login -->
        <div class="d-grid">
          <button
            id="google-login"
            class="btn google-btn d-flex align-items-center justify-content-center"
          >
            <img
              src="https://developers.google.com/identity/images/g-logo.png"
              alt="Google logo"
            />
            Login with Google
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
    <footer>
  <div class="footer-content">
    <div>
      <span class="highlight">Chapter:</span> UVCC / Sidney High School
    </div>
    <div>
      <span class="highlight">Members:</span>
      Nick Dietz (ID#00167749) &nbsp;|&nbsp; Keaton Shaffer (ID#00131482)
    </div>
    <div>
      <span class="highlight">School:</span> Sidney High School
    </div>
    <div>
      <span class="highlight">Location:</span> Sidney, Ohio &nbsp;|&nbsp;
      <span class="highlight">Year:</span> 2026
    </div>
  </div>
</footer>

  </body>
</html>
