<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SkillSwap Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

<style>
body { background:#0d0d0d; color:#fff; min-height:100vh; }
.navbar { background:#1a1a1a; box-shadow:0 2px 10px rgba(255,94,77,.3); }
.card { background:#1c1c1c; border-radius:16px; box-shadow:0 0 25px rgba(221,36,118,.3); }
#rosterTable { width:100%; border-collapse:collapse; margin-top:10px; }
#rosterTable th, #rosterTable td { border:1px solid #444; padding:8px; text-align:center; }
#rosterTable th { background:#333; }
</style>
</head>

<body>

<nav class="navbar navbar-dark fixed-top">
  <div class="container-fluid">
    <span class="navbar-brand fw-bold fs-4">SkillSwap Admin Panel</span>
  </div>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">
  <div class="col-md-9">
    <div class="card p-4 text-center">

      <h3 style="color:#ff8a65;">User Roster</h3>

      <table id="rosterTable">
        <thead>
          <tr>
            <th>Email</th>
            <th>Role</th>
            <th>Name</th>
            <th>Collection</th>
          </tr>
        </thead>
        <tbody id="RosterBody"></tbody>
      </table>

    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCotUqgZkDULpRLeyb9lvCma_SYO0CFb0",
  authDomain: "simpleloginapp-a7b53.firebaseapp.com",
  projectId: "simpleloginapp-a7b53",
  storageBucket: "simpleloginapp-a7b53.firebasestorage.app",
  messagingSenderId: "410260892945",
  appId: "1:410260892945:web:5339e6de4dbf5cec2cf0b0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const rosterBody = document.getElementById("RosterBody");

async function loadRoster() {
  rosterBody.innerHTML = "";
  let found = false;

  try {
    /* ---- STUDENTS / PROFILES ---- */
    const profilesSnap = await getDocs(collection(db, "profiles"));

    profilesSnap.forEach(docSnap => {
      found = true;
      const u = docSnap.data();

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${u.email || "-"}</td>
        <td>student</td>
        <td>${(u.firstName || "") + " " + (u.lastName || "")}</td>
        <td>profiles</td>
      `;
      rosterBody.appendChild(tr);
    });

    /* ---- TEACHERS ---- */
    const teachersSnap = await getDocs(collection(db, "teacherProfiles"));

    teachersSnap.forEach(docSnap => {
      found = true;
      const t = docSnap.data();

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${t.email || "-"}</td>
        <td>teacher</td>
        <td>${(t.firstName || "") + " " + (t.lastName || "")}</td>
        <td>teacherProfiles</td>
      `;
      rosterBody.appendChild(tr);
    });

    if (!found) {
      rosterBody.innerHTML = `<tr><td colspan="4">No users found.</td></tr>`;
    }

  } catch (err) {
    console.error("Roster error:", err);
    rosterBody.innerHTML = `<tr><td colspan="4">Error loading users.</td></tr>`;
  }
}

loadRoster();
</script>

</body>
</html>
