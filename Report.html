<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCotUqgZkDULpRLeyb9lvCma_SYO0CFb0",
  authDomain: "simpleloginapp-a7b53.firebaseapp.com",
  projectId: "simpleloginapp-a7b53",
  storageBucket: "simpleloginapp-a7b53.firebasestorage.app",
  messagingSenderId: "410260892945",
  appId: "1:410260892945:web:5339e6de4dbf5cec2cf0b0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const studentBody = document.getElementById("studentRosterBody");
const teacherBody = document.getElementById("teacherRosterBody");

/* ================= STUDENTS ================= */
async function loadStudents() {
  studentBody.innerHTML = "";

  try {
    const snap = await getDocs(collection(db, "profiles"));

    if (snap.empty) {
      studentBody.innerHTML = `<tr><td colspan="5">No students found.</td></tr>`;
      return;
    }

    snap.forEach(doc => {
      const s = doc.data();
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${s.firstName || ""} ${s.lastName || ""}</td>
        <td>${s.email || "-"}</td>
        <td>${s.grade || "-"}</td>
        <td>${s.classCode || "-"}</td>
      `;
      studentBody.appendChild(tr);
    });

  } catch (err) {
    console.error("Student load error:", err);
    studentBody.innerHTML = `<tr><td colspan="5">Error loading students</td></tr>`;
  }
}

/* ================= TEACHERS ================= */
async function loadTeachers() {
  teacherBody.innerHTML = "";

  try {
    const snap = await getDocs(collection(db, "teacherProfiles"));

    if (snap.empty) {
      teacherBody.innerHTML = `<tr><td colspan="4">No teachers found.</td></tr>`;
      return;
    }

    snap.forEach(doc => {
      const t = doc.data();
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${t.title || ""} ${t.firstName || ""} ${t.lastName || ""}</td>
        <td>${t.email || "-"}</td>
      `;
      teacherBody.appendChild(tr);
    });

  } catch (err) {
    console.error("Teacher load error:", err);
    teacherBody.innerHTML = `<tr><td colspan="4">Error loading teachers</td></tr>`;
  }
}

loadStudents();
loadTeachers();
</script>
