<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive layout for mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Page title -->
    <title>SkillSwap Admin Dashboard</title>

    <!-- Unordered list placeholder (currently unused, likely for future user listings) -->
    <ul id="usersList"></ul>

    <!-- Bootstrap CSS for layout and UI components -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      /* Global page styling */
      body {
        background-color: #0d0d0d;
        color: #fff;
        min-height: 100vh;
      }

      /* Navbar appearance */
      .navbar {
        background-color: #1a1a1a !important;
        box-shadow: 0 2px 10px rgba(255, 94, 77, 0.3);
      }

      /* Logo sizing and spacing */
      .navbar-brand img {
        width: 120px;
        margin-right: 14px;
      }

      /* Card styling */
      .card {
        background: #1c1c1c;
        border-radius: 16px;
        box-shadow: 0 0 25px rgba(221, 36, 118, 0.3);
        color: #fff;
      }

      /* Primary button styling */
      .btn-primary {
        background: linear-gradient(135deg, #ff512f, #dd2476);
        border: none;
      }

      /* Hover effect for primary buttons */
      .btn-primary:hover {
        background: linear-gradient(135deg, #dd2476, #ff512f);
      }

      /* Danger (logout) button styling */
      .btn-danger {
        background: #c62828;
        border: none;
      }

      .btn-danger:hover {
        background: #b71c1c;
      }
    </style>
  </head>

  <body>
    <!-- Top navigation bar -->
    <nav class="navbar navbar-dark fixed-top">
      <div class="container-fluid">
        <!-- Logo and dashboard title -->
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="Launchpad Learning Center.png" alt="Logo" />
          <span class="fw-bold fs-4">SkillSwap Admin Panel</span>
        </a>

        <!-- Logout button -->
        <button id="logoutBtn" class="btn btn-danger btn-sm">Logout</button>
      </div>
    </nav>

    <!-- Main content container -->
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="col-md-6">
        <!-- Admin welcome card -->
        <div class="card p-4 text-center">
          <h3 class="fw-bold mb-3" style="color: #ff8a65;">Welcome, Administrator!</h3>

          <!-- Displays logged-in admin email -->
          <p id="adminEmail" class="text-white mb-4" style="color: #ff8a65;"></p>

          <!-- Admin instructions -->
          <p>Manage users, teachers, and student accounts.</p>

          <!-- Admin navigation buttons -->
          <div class="d-grid gap-2">
            <!-- Navigate to user search -->
            <a href="../UserManagment.html" class="btn btn-primary">Search for User</a>
            </button>

            <!-- Navigate to user report/list -->
            <a href="../Report.html" class="btn btn-primary">View all Users</a></button>
          </div>
        </div>
      </div>
    </div>

    <!-- Firebase and application logic -->
    <script type="module">
      /* Firebase core */
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";

      /* Firebase authentication */
      import {
        getAuth,
        onAuthStateChanged,
        signOut
      } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

      /* Firestore database */
      import {
        getFirestore,
        doc,
        getDoc
      } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

      /* Firebase configuration */
      const firebaseConfig = {
        apiKey: "AIzaSyCCotUqgZkDULpRLeyb9lvCma_SYO0CFb0",
        authDomain: "simpleloginapp-a7b53.firebaseapp.com",
        projectId: "simpleloginapp-a7b53",
        storageBucket: "simpleloginapp-a7b53.firebasestorage.app",
        messagingSenderId: "410260892945",
        appId: "1:410260892945:web:5339e6de4dbf5cec2cf0b0"
      };

      /* Initialize Firebase services */
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      /* DOM references */
      const logoutBtn = document.getElementById("logoutBtn");
      const adminEmail = document.getElementById("adminEmail");

      /* Monitor authentication state */
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          /* Redirect unauthenticated users */
          window.location.href = "index.html";
          return;
        }

        /* Retrieve user document from Firestore */
        const userDoc = await getDoc(doc(db, "users", user.uid));

        /* Restrict access to admins only */
        if (!userDoc.exists() || userDoc.data().role !== "admin") {
          alert("Access denied. Admins only.");
          window.location.href = "index.html";
          return;
        }

        /* Display admin email */
        adminEmail.textContent = `Logged in as: ${user.email}`;
      });

      /* Logout handler */
      logoutBtn.addEventListener("click", async () => {
        await signOut(auth);
        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
