<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Launchpad Admin Dashboard</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #0d0d0d;
        color: #fff;
        min-height: 100vh;
      }
      .navbar {
        background-color: #1a1a1a !important;
        box-shadow: 0 2px 10px rgba(255, 94, 77, 0.3);
      }
      .navbar-brand img {
        width: 120px;
        margin-right: 14px;
      }
      .card {
        background: #1c1c1c;
        border-radius: 16px;
        box-shadow: 0 0 25px rgba(221, 36, 118, 0.3);
        color: #fff;
      }
      .btn-primary {
        background: linear-gradient(135deg, #ff512f, #dd2476);
        border: none;
      }
      .btn-primary:hover {
        background: linear-gradient(135deg, #dd2476, #ff512f);
      }
      .btn-danger {
        background: #c62828;
        border: none;
      }
      .btn-danger:hover {
        background: #b71c1c;
      }
      pre {
        background-color: #1a1a1a;
        padding: 10px;
        border-radius: 8px;
        overflow-x: auto;
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="Launchpad Learning Center.png" alt="Logo" />
          <span class="fw-bold fs-4">Launchpad Admin Panel</span>
        </a>
        <button id="logoutBtn" class="btn btn-danger btn-sm">Logout</button>
      </div>
    </nav>

    <!-- Main Container -->
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="col-md-6">
        <div class="card p-4 text-center">
          <h3 class="fw-bold mb-3" style="color: #ff8a65;">Search Users</h3>
          <p id="adminEmail" class="text-muted mb-4"></p>

          <!-- Email Input -->
          <input
            type="email"
            id="emailInput"
            placeholder="user@example.com"
            autocomplete="off"
            class="form-control mb-3"
          />

          <!-- Buttons -->
          <div class="d-grid gap-2 mb-3">
            <button id="searchBtn" class="btn btn-primary">Search Users</button>
            <a href="../admin.html" class="btn btn-primary">Home</a>
          </div>

          <!-- Result -->
          <pre id="result"></pre>
        </div>
      </div>
    </div>

    <!-- Firebase Initialization -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
      import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

      // 🔹 Firebase config
      const firebaseConfig = {
        apiKey: "AIzaSyCCotUqgZkDULpRLeyb9lvCma_SYO0CFb0",
        authDomain: "simpleloginapp-a7b53.firebaseapp.com",
        projectId: "simpleloginapp-a7b53",
        storageBucket: "simpleloginapp-a7b53.firebasestorage.app",
        messagingSenderId: "410260892945",
        appId: "1:410260892945:web:5339e6de4dbf5cec2cf0b0"
      };

      // 🔹 Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      // 🔹 DOM Elements
      const emailInput = document.getElementById("emailInput");
      const searchBtn = document.getElementById("searchBtn");
      const result = document.getElementById("result");
      const logoutBtn = document.getElementById("logoutBtn");
      const adminEmail = document.getElementById("adminEmail");

      // 🔹 Admin Auth Check
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          window.location.href = "index.html";
          return;
        }

        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (!userDoc.exists() || userDoc.data().role !== "admin") {
          alert("Access denied. Admins only.");
          window.location.href = "index.html";
          return;
        }

        adminEmail.textContent = `Logged in as: ${user.email}`;
      });

      // 🔹 Logout
      logoutBtn.addEventListener("click", async () => {
        await signOut(auth);
        window.location.href = "index.html";
      });

      // 🔹 Search Function
      async function findUserByEmail(email) {
        const q = query(collection(db, "users"), where("email", "==", email));
        const snapshot = await getDocs(q);
        if (snapshot.empty) return null;
        return snapshot.docs[0].data();
      }

      // 🔹 Button Press → Search
      searchBtn.addEventListener("click", async () => {
        const email = emailInput.value.trim().toLowerCase();
        if (!email) {
          result.textContent = "Please enter an email.";
          return;
        }

        result.textContent = "Searching...";

        try {
          const user = await findUserByEmail(email);
          if (!user) {
            result.textContent = "User not found.";
          } else {
            result.textContent = JSON.stringify(user, null, 2);
          }
        } catch (err) {
          console.error(err);
          result.textContent = "Error searching user.";
        }
      });
    </script>
  </body>
</html>
