<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Launchpad Student Profile</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #0d0d0d;
        color: #fff;
        min-height: 100vh;
      }
      .navbar {
        background-color: #1a1a1a !important;
        box-shadow: 0 2px 10px rgba(255, 94, 77, 0.3);
      }
      .navbar-brand img {
        width: 120px;
        margin-right: 14px;
      }
      .card {
        background: #1c1c1c;
        border-radius: 16px;
        box-shadow: 0 0 25px rgba(221, 36, 118, 0.3);
        color: #fff;
      }
      label {
        color: #ffb199;
        font-weight: 500;
      }
      input, select {
        background-color: #2b2b2b !important;
        color: #fff !important;
        border: 1px solid #444 !important;
      }
      input::placeholder {
        color: #aaa;
      }
      .btn-primary {
        background: linear-gradient(135deg, #ff512f, #dd2476);
        border: none;
      }
      .btn-primary:hover {
        background: linear-gradient(135deg, #dd2476, #ff512f);
      }
      .btn-danger {
        background: #c62828;
        border: none;
      }
      .btn-danger:hover {
        background: #b71c1c;
      }
    </style>
  </head>

  <body>
    <!-- 🚀 Navbar -->
    <nav class="navbar navbar-dark fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="Launchpad Learning Center.png" alt="Logo" />
          <span class="fw-bold fs-4">Launchpad Learning Center</span>
        </a>
        <button id="logoutBtn" class="btn btn-danger btn-sm">Logout</button>
      </div>
    </nav>

    <!-- 🚀 Centered Profile Form -->
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="col-md-6">
        <div class="card p-4 text-center">
          <h3 class="fw-bold mb-3" style="color: #ff8a65;">Student Profile</h3>
          <p id="userEmail" class="text-muted mb-4"></p>

          <form id="profileForm" class="text-start">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" class="form-control" placeholder="Enter your first name" required />
              </div>
              <div class="col-md-6 mb-3">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" class="form-control" placeholder="Enter your last name" required />
              </div>
            </div>

            <div class="mb-3">
              <label for="grade">Grade</label>
              <select id="grade" class="form-select" required>
                <option value="" disabled selected>Select your grade</option>
                <option value="9">9th Grade</option>
                <option value="10">10th Grade</option>
                <option value="11">11th Grade</option>
                <option value="12">12th Grade</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="age">Age</label>
              <input type="number" id="age" class="form-control" placeholder="Enter your age" required />
            </div>

            <div class="mb-3">
              <label for="classCode">Class Code</label>
              <input type="text" id="classCode" class="form-control" placeholder="Enter your class code" required />
            </div>

            <div class="d-grid gap-2 mt-4">
              <button type="submit" id="save-btn" class="btn btn-primary">
                Save Profile
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
        signOut
      } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
      import {
        getFirestore,
        doc,
        setDoc,
        getDoc
      } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCCotUqgZkDULpRLeyb9lvCma_SYO0CFb0",
        authDomain: "simpleloginapp-a7b53.firebaseapp.com",
        projectId: "simpleloginapp-a7b53",
        storageBucket: "simpleloginapp-a7b53.firebasestorage.app",
        messagingSenderId: "410260892945",
        appId: "1:410260892945:web:5339e6de4dbf5cec2cf0b0"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const userEmail = document.getElementById("userEmail");
      const profileForm = document.getElementById("profileForm");
      const logoutBtn = document.getElementById("logoutBtn");

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          window.location.href = "index.html";
          return;
        }

        userEmail.textContent = `Logged in as: ${user.email}`;

        const userRef = doc(db, "profiles", user.uid);
        const docSnap = await getDoc(userRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById("firstName").value = data.firstName || "";
          document.getElementById("lastName").value = data.lastName || "";
          document.getElementById("grade").value = data.grade || "";
          document.getElementById("age").value = data.age || "";
          document.getElementById("classCode").value = data.classCode || "";
        }

        profileForm.addEventListener("submit", async (e) => {
          e.preventDefault();

          const firstName = document.getElementById("firstName").value;
          const lastName = document.getElementById("lastName").value;
          const grade = document.getElementById("grade").value;
          const age = parseInt(document.getElementById("age").value);
          const classCode = document.getElementById("classCode").value;

          await setDoc(userRef, {
            firstName,
            lastName,
            grade,
            age,
            classCode,
            email: user.email,
          });

          alert("Profile saved successfully!");
        });
      });

      logoutBtn.addEventListener("click", async () => {
        await signOut(auth);
        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
