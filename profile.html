<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Launchpad Student Profile</title>

<!-- Bootstrap CSS -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>

<style>
body {
  background-color: #0d0d0d;
  color: #fff;
  min-height: 100vh;
}
.navbar {
  background-color: #1a1a1a !important;
  box-shadow: 0 2px 10px rgba(255, 94, 77, 0.3);
}
.navbar-brand img {
  width: 120px;
  margin-right: 14px;
}
.card {
  background: #1c1c1c;
  border-radius: 16px;
  box-shadow: 0 0 25px rgba(221, 36, 118, 0.3);
  color: #fff;
}
label {
  color: #ffb199;
  font-weight: 500;
}
input, select, textarea {
  background-color: #2b2b2b !important;
  color: #fff !important;
  border: 1px solid #444 !important;
}
input::placeholder, textarea::placeholder {
  color: #aaa;
}
.btn-primary {
  background: linear-gradient(135deg, #ff512f, #dd2476);
  border: none;
}
.btn-primary:hover {
  background: linear-gradient(135deg, #dd2476, #ff512f);
}
.btn-danger {
  background: #c62828;
  border: none;
}
.btn-danger:hover {
  background: #b71c1c;
}
.assignment-card {
  background: #2c2c2c;
  border-radius: 12px;
  padding: 15px;
}
</style>
</head>

<body>

<!-- 🚀 Navbar -->
<nav class="navbar navbar-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="Launchpad Learning Center.png" alt="Logo" />
      <span class="fw-bold fs-4">Launchpad Learning Center</span>
    </a>
    <button id="logoutBtn" class="btn btn-danger btn-sm">Logout</button>
  </div>
</nav>

<!-- 🚀 Main Content -->
<div class="container pt-5 mt-5">

  <!-- Profile Card -->
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4 text-center">
        <h3 class="fw-bold mb-3" style="color:#ff8a65;">Student Profile</h3>
        <p id="userEmail" class="text-muted mb-4"></p>

        <form id="profileForm" class="text-start">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label>First Name</label>
              <input id="firstName" class="form-control" required />
            </div>
            <div class="col-md-6 mb-3">
              <label>Last Name</label>
              <input id="lastName" class="form-control" required />
            </div>
          </div>

          <div class="mb-3">
            <label>Grade</label>
            <select id="grade" class="form-select" required>
              <option value="" disabled>Select your grade</option>
              <option value="9">9th Grade</option>
              <option value="10">10th Grade</option>
              <option value="11">11th Grade</option>
              <option value="12">12th Grade</option>
            </select>
          </div>

          <div class="mb-3">
            <label>Age</label>
            <input id="age" type="number" class="form-control" required />
          </div>

          <div class="mb-3">
            <label>Class Code</label>
            <input id="classCode" class="form-control" required />
          </div>

          <button class="btn btn-primary w-100">Save / Join Class</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Assignments -->
  <div class="row justify-content-center mt-4">
    <div class="col-md-10">
      <div class="card p-4">
        <h4 class="fw-bold mb-3" style="color:#ff8a65;">My Assignments</h4>
        <div id="assignmentList">Join a class to see assignments.</div>
      </div>
    </div>
  </div>

</div>

<script type="module" src="profile.js"></script>
</body>
</html>
