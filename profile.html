<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: #fff;
    padding: 20px;
}

h1, h2 {
    text-align: center;
    color: #4dd0e1;
}

.assignment {
    background: #1c1c1c;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    border-left: 5px solid #4dd0e1;
}

textarea, input, button {
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    border-radius: 6px;
    border: none;
}

button {
    background: #4dd0e1;
    font-weight: bold;
    cursor: pointer;
}

.grade-box {
    background: #102027;
    padding: 10px;
    border-radius: 8px;
    margin-top: 10px;
    border-left: 5px solid #00e5ff;
}
</style>
</head>

<body>

<h1>My Classes</h1>
<div id="assignments"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {
    getFirestore,
    collection,
    doc,
    setDoc,
    getDoc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyCCotUqgZkDULpRLeyb9lvCma_SYO0CFb0",
    authDomain: "simpleloginapp-a7b53.firebaseapp.com",
    projectId: "simpleloginapp-a7b53",
    storageBucket: "simpleloginapp-a7b53.firebasestorage.app",
    messagingSenderId: "410260892945",
    appId: "1:410260892945:web:5339e6de4dbf5cec2cf0b0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const assignmentsDiv = document.getElementById("assignments");

/* ------------ AUTH ------------ */
onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "index.html";
        return;
    }

    loadStudentAssignments(user);
});

/* ------------ LOAD ASSIGNMENTS ------------ */
function loadStudentAssignments(user) {

    // ⚠️ If you already have logic that determines which classes
    // the student is enrolled in — keep that code.
    // This example assumes you already have a `myClasses` array somewhere.

    const myClasses = JSON.parse(localStorage.getItem("myClasses")) || [];

    assignmentsDiv.innerHTML = "";

    myClasses.forEach(classCode => {
        const assignmentsRef = collection(
            db,
            "classes",
            classCode,
            "assignments"
        );

        onSnapshot(assignmentsRef, (snapshot) => {
            snapshot.forEach(async (assignmentDoc) => {
                const assignment = assignmentDoc.data();
                const assignmentId = assignmentDoc.id;

                const submissionRef = doc(
                    db,
                    "classes",
                    classCode,
                    "assignments",
                    assignmentId,
                    "submissions",
                    user.uid
                );

                const submissionSnap = await getDoc(submissionRef);
                const submission = submissionSnap.exists()
                    ? submissionSnap.data()
                    : null;

                const div = document.createElement("div");
                div.className = "assignment";

                div.innerHTML = `
                    <h3>${assignment.title}</h3>
                    <p>${assignment.description}</p>
                    ${assignment.dueDate ? `<small>Due: ${assignment.dueDate}</small>` : ""}

                    <textarea placeholder="Enter your submission..." id="text-${assignmentId}"></textarea>
                    <button onclick="submitWork('${classCode}','${assignmentId}')">Submit</button>

                    ${
                        submission?.grade
                        ? `
                            <div class="grade-box">
                                <strong>Grade:</strong> ${submission.grade}<br/>
                                <strong>Feedback:</strong> ${submission.feedback || "None"}
                            </div>
                          `
                        : `<p style="color:#aaa;">Not graded yet</p>`
                    }
                `;

                assignmentsDiv.appendChild(div);
            });
        });
    });
}

/* ------------ SUBMIT WORK ------------ */
window.submitWork = async (classCode, assignmentId) => {
    const user = auth.currentUser;
    const text = document.getElementById(`text-${assignmentId}`).value;

    if (!text.trim()) {
        alert("Please enter a submission.");
        return;
    }

    const submissionRef = doc(
        db,
        "classes",
        classCode,
        "assignments",
        assignmentId,
        "submissions",
        user.uid
    );

    await setDoc(submissionRef, {
        submission: text,
        studentEmail: user.email,
        submittedAt: new Date().toISOString()
    });

    alert("✅ Submission sent!");
};
</script>

</body>
</html>
