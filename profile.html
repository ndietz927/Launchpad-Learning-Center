<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Launchpad Student Profile</title>

<!-- Bootstrap CSS -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>

<style>
  body { background-color: #0d0d0d; color: #fff; min-height: 100vh; padding:20px;}
  .navbar { background-color: #1a1a1a !important; box-shadow: 0 2px 10px rgba(255, 94, 77, 0.3); }
  .navbar-brand img { width:120px; margin-right:14px; }
  .card { background:#1c1c1c; border-radius:16px; box-shadow:0 0 25px rgba(221,36,118,0.3); color:#fff; }
  label { color:#ffb199; font-weight:500; }
  input, select, textarea { background-color:#2b2b2b !important; color:#fff !important; border:1px solid #444 !important; }
  input::placeholder, textarea::placeholder { color:#aaa; }
  .btn-primary { background: linear-gradient(135deg,#ff512f,#dd2476); border:none; }
  .btn-primary:hover { background: linear-gradient(135deg,#dd2476,#ff512f); }
  .btn-danger { background: #c62828; border:none; }
  .btn-danger:hover { background:#b71c1c; }
  .assignment { border-left:6px solid #ff512f; margin-bottom:10px; padding:10px; border-radius:8px; }
  .post { border-left:6px solid #6c757d; margin-bottom:10px; padding:10px; border-radius:8px; }
  .submit-btn { margin-top:10px; }
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="Launchpad Learning Center.png" alt="Logo" />
      <span class="fw-bold fs-4">Launchpad Learning Center</span>
    </a>
    <button id="logoutBtn" class="btn btn-danger btn-sm">Logout</button>
  </div>
</nav>

<div style="margin-top:80px;" class="container">
  <div class="col-md-6 mx-auto">
    <div class="card p-4 text-center">
      <h3 class="fw-bold mb-3" style="color:#ff8a65;">Student Profile</h3>
      <p id="userEmail" class="text-muted mb-4"></p>

      <!-- Profile Form -->
      <form id="profileForm" class="text-start">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label>First Name</label>
            <input type="text" id="firstName" class="form-control" required />
          </div>
          <div class="col-md-6 mb-3">
            <label>Last Name</label>
            <input type="text" id="lastName" class="form-control" required />
          </div>
        </div>

        <div class="mb-3">
          <label>Grade</label>
          <select id="grade" class="form-select" required>
            <option value="">Select grade</option>
            <option value="9">9th</option>
            <option value="10">10th</option>
            <option value="11">11th</option>
            <option value="12">12th</option>
          </select>
        </div>

        <div class="mb-3">
          <label>Age</label>
          <input type="number" id="age" class="form-control" required />
        </div>

        <div class="mb-3">
          <label>Class Code</label>
          <input type="text" id="classCode" class="form-control" required />
        </div>

        <button class="btn btn-primary w-100">Save Profile</button>
      </form>

      <!-- Class Content -->
      <div id="classContentDiv" style="margin-top:30px;"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, collection,
  onSnapshot, query, where, getDocs
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCotUqgZkDULpRLeyb9lvCma_SYO0CFb0",
  authDomain: "simpleloginapp-a7b53.firebaseapp.com",
  projectId: "simpleloginapp-a7b53",
  storageBucket: "simpleloginapp-a7b53.firebasestorage.app",
  messagingSenderId: "410260892945",
  appId: "1:410260892945:web:5339e6de4dbf5cec2cf0b0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* Elements */
const userEmail = document.getElementById("userEmail");
const profileForm = document.getElementById("profileForm");
const logoutBtn = document.getElementById("logoutBtn");
const classContentDiv = document.getElementById("classContentDiv");

let currentClassCode = "";

/* Auth */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }

  userEmail.textContent = `Logged in as: ${user.email}`;
  const userRef = doc(db, "profiles", user.uid);
  const snap = await getDoc(userRef);

  if (snap.exists()) {
    const d = snap.data();
    firstName.value = d.firstName || "";
    lastName.value = d.lastName || "";
    grade.value = d.grade || "";
    age.value = d.age || "";
    classCode.value = d.classCode || "";

    if (d.classCode) {
      currentClassCode = d.classCode;
      loadClassContent(currentClassCode, user.uid);
    }
  }

  profileForm.onsubmit = async (e) => {
    e.preventDefault();

    await setDoc(userRef, {
      firstName: firstName.value,
      lastName: lastName.value,
      grade: grade.value,
      age: parseInt(age.value),
      classCode: classCode.value,
      email: user.email
    });

    currentClassCode = classCode.value;
    loadClassContent(currentClassCode, user.uid);
    alert("Profile saved!");
  };
});

/* Logout */
logoutBtn.onclick = async () => {
  await signOut(auth);
  window.location.href = "index.html";
};

/* Load Class + Teacher + Assignments */
async function loadClassContent(classCode, studentUid) {
  classContentDiv.innerHTML = `
    <div id="classHeaderInfo" class="mb-3"></div>
    <h4 style="color:#ff8a65;">Assignments</h4>
    <div id="studentContent"></div>
  `;

  const headerDiv = document.getElementById("classHeaderInfo");
  const studentContent = document.getElementById("studentContent");

  const classSnap = await getDoc(doc(db, "classes", classCode));
  if (!classSnap.exists()) {
    headerDiv.innerHTML = `<p class="text-danger">Class not found.</p>`;
    return;
  }

  const classData = classSnap.data();
  let teacherName = "Unknown Teacher";

  if (classData.teacherEmail) {
    const q = query(collection(db, "teacherProfiles"), where("email", "==", classData.teacherEmail));
    const result = await getDocs(q);
    if (!result.empty) {
      const t = result.docs[0].data();
      teacherName = `${t.title || ""} ${t.firstName || ""} ${t.lastName || ""}`;
    }
  }

  headerDiv.innerHTML = `
    <div class="p-3 mb-3" style="background:#222;border-radius:10px;">
      <strong>Class:</strong> ${classData.name}<br/>
      <strong>Teacher:</strong> ${teacherName}
    </div>
  `;

  const assignmentsRef = collection(db, "classes", classCode, "assignments");

  onSnapshot(assignmentsRef, (snapshot) => {
    studentContent.innerHTML = "";

    snapshot.forEach((docSnap) => {
      const a = docSnap.data();
      const assignmentId = docSnap.id;

      const div = document.createElement("div");
      div.className = "assignment";
      div.innerHTML = `
        <h5>${a.title}</h5>
        <p>${a.description}</p>
        <small>Due: ${a.dueDate || "N/A"}</small>
        <div class="grade mt-2"></div>
      `;

      const gradeDiv = div.querySelector(".grade");

      const submissionRef = doc(
        db, "classes", classCode, "assignments", assignmentId,
        "submissions", studentUid
      );

      onSnapshot(submissionRef, (snap) => {
        if (snap.exists()) {
          const sub = snap.data();
          gradeDiv.innerHTML = sub.grade
            ? `✅ Grade: <strong>${sub.grade}</strong>`
            : "⏳ Awaiting grade";
        }
      });

      const submitBtn = document.createElement("button");
      submitBtn.className = "btn btn-primary submit-btn";
      submitBtn.textContent = "Submit";

      submitBtn.onclick = async () => {
        const submission = prompt("Paste your submission:");
        if (!submission) return;

        await setDoc(submissionRef, {
          submission,
          submittedAt: new Date().toISOString(),
          studentEmail: auth.currentUser.email,
          grade: ""
        });

        alert("Submitted!");
        submitBtn.disabled = true;
      };

      div.appendChild(submitBtn);
      studentContent.appendChild(div);
    });
  });
}
</script>

</body>
</html>
