<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Launchpad Student Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

<style>
body { background-color:#0d0d0d; color:#fff; padding:20px;}
.navbar { background:#1a1a1a; box-shadow:0 2px 10px rgba(255,94,77,.3); }
.card { background:#1c1c1c; border-radius:16px; box-shadow:0 0 25px rgba(221,36,118,.3); }
input,select,textarea { background:#2b2b2b!important; color:#fff!important; border:1px solid #444!important;}
.btn-primary { background:linear-gradient(135deg,#ff512f,#dd2476); border:none;}
.assignment { border-left:6px solid #ff512f; padding:12px; margin-bottom:10px; border-radius:8px;}
.grade-box { margin-top:8px; font-weight:bold; color:#00e676; }
.chat-box { max-height:300px; overflow-y:auto; background:#111; padding:10px; border-radius:10px;}
</style>
</head>

<body>

<nav class="navbar navbar-dark fixed-top px-3">
  <span class="fw-bold">Launchpad Student</span>
  <button id="logoutBtn" class="btn btn-danger btn-sm">Logout</button>
</nav>

<div style="margin-top:80px;" class="container col-md-7">

<div class="card p-4 mb-4">
<h3 class="text-center" style="color:#ff8a65;">Student Profile</h3>

<form id="profileForm">
<input id="firstName" placeholder="First Name" required />
<input id="lastName" placeholder="Last Name" required />
<input id="classCode" placeholder="Class Code" required />
<button class="btn btn-primary mt-3">Save</button>
</form>
</div>

<div class="card p-4 mb-4">
<h4 style="color:#ff8a65;">Class Content</h4>
<div id="studentContent"></div>
</div>

<div class="card p-4">
<h4 style="color:#ff8a65;">Class Messages</h4>
<div id="chatBox" class="chat-box mb-2"></div>
<div class="d-flex gap-2">
  <input id="chatInput" placeholder="Type message..." />
  <button id="sendBtn">Send</button>
</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import {
  getFirestore,doc,setDoc,getDoc,collection,onSnapshot,addDoc,
  query,orderBy,serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
 apiKey:"AIzaSyCCotUqgZkDULpRLeyb9lvCma_SYO0CFb0",
 authDomain:"simpleloginapp-a7b53.firebaseapp.com",
 projectId:"simpleloginapp-a7b53",
 storageBucket:"simpleloginapp-a7b53.firebasestorage.app",
 messagingSenderId:"410260892945",
 appId:"1:410260892945:web:5339e6de4dbf5cec2cf0b0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const studentContent = document.getElementById("studentContent");
const chatBox = document.getElementById("chatBox");
const chatInput = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendBtn");

let classCode = "";
let senderName = "Student";
let senderRole = "student";

/* ---------- AUTH ---------- */
onAuthStateChanged(auth, async (user) => {
 if(!user) location.href="index.html";

 const profileRef = doc(db,"profiles",user.uid);
 const snap = await getDoc(profileRef);

 if(snap.exists()){
   const data = snap.data();
   document.getElementById("firstName").value = data.firstName || "";
   document.getElementById("lastName").value = data.lastName || "";
   document.getElementById("classCode").value = data.classCode || "";
   senderName = `${data.firstName} ${data.lastName}`;
   classCode = data.classCode;
   loadAssignments(user.uid);
   loadMessages();
 }

 document.getElementById("profileForm").onsubmit = async e=>{
   e.preventDefault();
   const firstName = firstName.value;
   const lastName = lastName.value;
   classCode = classCodeInput.value;

   await setDoc(profileRef,{firstName,lastName,classCode,email:user.email});
   senderName = `${firstName} ${lastName}`;
   loadAssignments(user.uid);
   loadMessages();
 };
});

/* ---------- ASSIGNMENTS + GRADES ---------- */
function loadAssignments(uid){
 const ref = collection(db,"classes",classCode,"assignments");
 onSnapshot(ref, snap=>{
   studentContent.innerHTML="";
   snap.forEach(async docSnap=>{
     const a = docSnap.data();
     const subRef = doc(db,"classes",classCode,"assignments",docSnap.id,"submissions",uid);
     const subSnap = await getDoc(subRef);

     let gradeHTML = "";
     if(subSnap.exists() && subSnap.data().grade){
        gradeHTML = `<div class="grade-box">Grade: ${subSnap.data().grade}</div>`;
     }

     const div=document.createElement("div");
     div.className="assignment";
     div.innerHTML=`
      <h5>${a.title}</h5>
      <p>${a.description}</p>
      ${gradeHTML}
     `;

     const btn=document.createElement("button");
     btn.textContent="Submit";
     btn.onclick=async()=>{
       const text=prompt("Paste your submission:");
       if(text){
         await setDoc(subRef,{
           submission:text,
           studentEmail:auth.currentUser.email,
           submittedAt:new Date().toISOString()
         });
         alert("Submitted!");
       }
     };

     div.appendChild(btn);
     studentContent.appendChild(div);
   });
 });
}

/* ---------- MESSAGING ---------- */
function messagesRef(){
 return collection(db,"classes",classCode,"messages");
}

function loadMessages(){
 const q=query(messagesRef(),orderBy("timestamp"));
 onSnapshot(q,snap=>{
   chatBox.innerHTML="";
   snap.forEach(d=>{
     const m=d.data();
     const t=m.timestamp?.toDate()?.toLocaleString()||"";
     chatBox.innerHTML+=`
      <div>
       <strong>${m.senderName}</strong>
       <small style="color:#aaa;">(${m.senderRole} • ${t})</small>
       <div>${m.message}</div>
       <hr/>
      </div>`;
   });
   chatBox.scrollTop=chatBox.scrollHeight;
 });
}

sendBtn.onclick=async()=>{
 if(!chatInput.value) return;
 await addDoc(messagesRef(),{
  senderName,
  senderRole,
  message:chatInput.value,
  timestamp:serverTimestamp()
 });
 chatInput.value="";
};

document.getElementById("logoutBtn").onclick=async()=>{
 await signOut(auth);
 location.href="index.html";
};
</script>
</body>
</html>
