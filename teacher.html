<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Teacher Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #0d0d0d;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ff512f, #dd2476);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 0 25px rgba(221, 36, 118, 0.25);
      margin-bottom: 30px;
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 15px;
      color: #ffb199;
    }

    input {
      width: 100%;
      background-color: #2b2b2b;
      color: #fff;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      margin-bottom: 15px;
    }

    input::placeholder {
      color: #aaa;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff512f, #dd2476);
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #dd2476, #ff512f);
    }

    .class-item {
      background-color: #2b2b2b;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      border-left: 4px solid #ff8a65;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .class-item strong {
      color: #ffb199;
      font-size: 1.05rem;
    }

    .class-actions button {
      margin-left: 10px;
    }

    .btn-outline {
      border: 1px solid #ff8a65;
      color: #ff8a65;
      background: transparent;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .btn-outline:hover {
      background: #ff8a65;
      color: #000;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Teacher Dashboard</h1>
    <p class="subtitle">Create and manage your classes</p>

    <!-- Create Class -->
    <div class="card">
      <h2>Create a Class</h2>
      <input id="className" type="text" placeholder="Class name (e.g. Intro to Firebase)" />
      <button id="createClassBtn" class="btn-primary">Create Class</button>
    </div>

    <!-- Class List -->
    <div class="card">
      <h2>Your Classes</h2>
      <div id="classList"></div>
    </div>
  </div>

  <!-- Firebase Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      getDocs,
      query,
      where,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCotUqgZkDULpRLeyb9lvCma_SYO0CFb0",
      authDomain: "simpleloginapp-a7b53.firebaseapp.com",
      projectId: "simpleloginapp-a7b53",
      storageBucket: "simpleloginapp-a7b53.firebasestorage.app",
      messagingSenderId: "410260892945",
      appId: "1:410260892945:web:5339e6de4dbf5cec2cf0b0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const classList = document.getElementById("classList");
    const createBtn = document.getElementById("createClassBtn");
    const classNameInput = document.getElementById("className");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      loadClasses(user.uid);
    });

    createBtn.addEventListener("click", async () => {
      const name = classNameInput.value.trim();
      if (!name) return alert("Enter a class name");

      const classCode = Math.floor(10000000 + Math.random() * 90000000).toString();

      await setDoc(doc(db, "classes", classCode), {
        name,
        teacherUid: auth.currentUser.uid,
        teacherEmail: auth.currentUser.email,
        createdAt: serverTimestamp()
      });

      classNameInput.value = "";
      loadClasses(auth.currentUser.uid);
    });

    async function loadClasses(uid) {
      classList.innerHTML = "";

      const q = query(collection(db, "classes"), where("teacherUid", "==", uid));
      const snapshot = await getDocs(q);

      snapshot.forEach(docSnap => {
        const cls = docSnap.data();

        const div = document.createElement("div");
        div.className = "class-item";
        div.innerHTML = `
          <strong>${cls.name}</strong>
          <div class="class-actions">
            <button class="btn-outline" onclick="location.href='class.html?code=${docSnap.id}'">
              View Class
            </button>
          </div>
        `;
        classList.appendChild(div);
      });
    }
  </script>
</body>
</html>
